<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Gaming Gear — Bytes For Gaming</title>
  <meta name="description" content="Browse and compare gaming accessories from 8BitDo, Razer, Logitech G, SteelSeries, Corsair and more. Filter by category and brand, sort by price or rating, and find the best deal." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="container page-head">
      <h1>Browse &amp; compare gear</h1>
      <p class="lead">Every product is compared across 5 major stores. Click any card to see prices side by side and buy from the smartest option.</p>
    </section>

    <section class="container">
      <div class="browse-toolbar">
        <div class="search-sort">
          <div class="search-box">
            <input type="search" id="search-input" placeholder="Search gear, brands, features…" aria-label="Search gear" />
          </div>
          <div class="sort-wrap">
            <label for="sort-select" class="muted small">Sort</label>
            <select id="sort-select" aria-label="Sort products">
              <option value="rating">Top rated</option>
              <option value="deal">Best deal</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
            </select>
          </div>
        </div>
        <div>
          <div class="filter-label">Category</div>
          <div id="filter-cats"></div>
        </div>
        <div>
          <div class="filter-label">Brand</div>
          <div id="filter-brands"></div>
        </div>
      </div>

      <p class="browse-count muted"><span id="result-count">—</span></p>
      <div class="grid" id="browse-grid"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/prices.js"></script>
  <script src="js/components.js"></script>
  <script src="js/browse.js"></script>
  <script>BFG.ui.renderChrome('browse');</script>
</body>
</html>
