# Netlify config for Bytes For Gaming
# Static site at the repo root + a serverless price API.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # ensure the shared core module is bundled with the function
  included_files = ["server/lib/**"]

# Expose the function at the same path the front-end expects: /api/prices
[[redirects]]
  from = "/api/prices"
  to = "/.netlify/functions/prices"
  status = 200
